server {
    listen 80;
    server_name localhost;

    # 1. Serve the Frontend static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # This is crucial for React/Vite: if a file isn't found, fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy /api/ requests to the Backend container
    location /api/ {
        # IMPORTANT: Change "backend" to the exact service name in your docker-compose.yml
        # IMPORTANT: Change "8000" to the port your Python backend is running on internally
        proxy_pass http://backend:8000/api/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}