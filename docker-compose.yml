services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tf-idf-backend:latest
    container_name: tfidf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: backend.django_project.settings
      PYTHONUNBUFFERED: '1'
      CORPUS_DIR: '/app/corpus'
    volumes:
      # Application code (read-only for production safety)
      - ./backend:/app/backend:ro
      # Corpus data 
      - ./corpus:/app/corpus
      # Cache directory (uses named volume for better performance and persistence)
      - data_cache:/app/data_cache
    networks:
      - tfidf-network

  frontend:
      build: 
        context: ./Frontend
        dockerfile: Dockerfile
      ports:
        - "80:80" # Maps port 80 on your local machine to port 80 in the container
      restart: unless-stopped
      depends_on:
        - backend
      networks:
        - tfidf-network

volumes:
  data_cache:
    driver: local

networks:
  tfidf-network:
    driver: bridge
